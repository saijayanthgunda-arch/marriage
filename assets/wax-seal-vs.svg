<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Wax depression radial gradient matching the video seal -->
    <radialGradient id="waxDepression" cx="44%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#f8f2e5"/>
      <stop offset="35%" stop-color="#efe4d0"/>
      <stop offset="70%" stop-color="#e0d1b7"/>
      <stop offset="88%" stop-color="#cbbba0"/>
      <stop offset="100%" stop-color="#b6a385" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Subtle soft rim shadow to simulate the depression wall -->
    <radialGradient id="rimShadow" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="90%" stop-color="#6e5838" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4a3518" stop-opacity="0.38"/>
    </radialGradient>

    <!-- Rich Antique Gold Text Gradient matching the video -->
    <linearGradient id="goldText" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#6d4d1f"/>
      <stop offset="20%" stop-color="#9a7433"/>
      <stop offset="42%" stop-color="#e2ca88"/>
      <stop offset="55%" stop-color="#c8a85c"/>
      <stop offset="80%" stop-color="#8c6628"/>
      <stop offset="100%" stop-color="#553a14"/>
    </linearGradient>

    <!-- Filter for soft subtle deboss effect -->
    <filter id="deboss" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Opaque inner wax depression base (covers S&B 100%) -->
  <circle cx="100" cy="100" r="92" fill="url(#waxDepression)" />
  <!-- Inner rim shadow for natural depth -->
  <circle cx="100" cy="100" r="92" fill="url(#rimShadow)" />

  <!-- Stamped Monogram: V&S -->
  <g id="monogram">
    <!-- Debossed top-left inner shadow for pressed-in look -->
    <text x="100.5" y="113.5"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="46"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      fill="rgba(50, 32, 10, 0.55)"
      text-anchor="middle">V&amp;S</text>

    <!-- Bottom-right subtle highlight edge -->
    <text x="99.5" y="111.5"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="46"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      fill="rgba(255, 255, 255, 0.45)"
      text-anchor="middle">V&amp;S</text>

    <!-- Main Rich Metallic Gold Text -->
    <text x="100" y="112.5"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="46"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      fill="url(#goldText)"
      text-anchor="middle">V&amp;S</text>
  </g>
</svg>