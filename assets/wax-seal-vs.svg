<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Wax depression radial gradient matching the ivory wax seal -->
    <radialGradient id="waxDepression" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#faf5ec"/>
      <stop offset="40%" stop-color="#f2e7d5"/>
      <stop offset="72%" stop-color="#e3d4be"/>
      <stop offset="88%" stop-color="#cfbea2"/>
      <stop offset="100%" stop-color="#b8a586" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Concentric 3D debossed inner bevel rim -->
    <radialGradient id="innerBevel" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="92%" stop-color="#6e5838" stop-opacity="0.25"/>
      <stop offset="98%" stop-color="#4a3518" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2a1e0e" stop-opacity="0.6"/>
    </radialGradient>

    <!-- Fine circular inner ring gradient -->
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#aa8228" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Rich Antique Metallic Gold Text Gradient -->
    <linearGradient id="goldText" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#6d4d1f"/>
      <stop offset="22%" stop-color="#a37b34"/>
      <stop offset="45%" stop-color="#e8d394"/>
      <stop offset="58%" stop-color="#cfad60"/>
      <stop offset="82%" stop-color="#8c6628"/>
      <stop offset="100%" stop-color="#553a14"/>
    </linearGradient>

    <!-- Soft deboss filter for stamped depth -->
    <filter id="deboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Perfectly Centered Inner Wax Circle (Center at 100, 100, radius 92) -->
  <circle cx="100" cy="100" r="92" fill="url(#waxDepression)" />
  
  <!-- Subtle decorative concentric inner ring for classical seal aesthetics -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#ringGold)" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.6" />
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#ringGold)" stroke-width="0.8" opacity="0.45" />

  <!-- Depth Bevel Rim Shadow -->
  <circle cx="100" cy="100" r="92" fill="url(#innerBevel)" />

  <!-- Stamped Monogram: V&S (Optically and mathematically centered at 102, 100) -->
  <g id="monogram">
    <!-- Top-Left Inner Shadow (Deboss depth) -->
    <text x="102" y="101"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="44"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      dominant-baseline="central"
      text-anchor="middle"
      fill="rgba(45, 28, 8, 0.5)">V&amp;S</text>

    <!-- Bottom-Right Subtle Highlight Edge -->
    <text x="100.8" y="99"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="44"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      dominant-baseline="central"
      text-anchor="middle"
      fill="rgba(255, 255, 255, 0.5)">V&amp;S</text>

    <!-- Main Rich Metallic Gold Text -->
    <text x="101.5" y="100"
      font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif"
      font-size="44"
      font-weight="700"
      font-style="italic"
      letter-spacing="2"
      dominant-baseline="central"
      text-anchor="middle"
      fill="url(#goldText)">V&amp;S</text>
  </g>
</svg>